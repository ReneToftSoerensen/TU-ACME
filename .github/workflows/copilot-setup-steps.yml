name: "Copilot Setup Steps"

# Run automatically when this file changes (validates the setup), and allow
# manual runs from the Actions tab.
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # MUST be named exactly `copilot-setup-steps` to be picked up by the agent.
    copilot-setup-steps:
        # Use Windows to match CI and the Windows/IIS nature of TU-ACME.
        runs-on: windows-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Pre-install all PowerShell module dependencies so the agent does
            # not need to discover or install them via bash/view at task start.
            - name: Install PowerShell modules
              shell: pwsh
              run: |
                  Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
                  Install-Module -Name Pester          -MinimumVersion 5.0 -Force -Scope CurrentUser
                  Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
                  Install-Module -Name Posh-ACME        -MinimumVersion 4.0 -Force -Scope CurrentUser

            # Validate the module loads cleanly so the agent can rely on it.
            - name: Validate module import
              shell: pwsh
              run: Import-Module ./src/TU-ACME.psd1 -Force

            # Generate a compact symbol index: every public function, private
            # helper, and parameter defined in src/ — one line per symbol.
            # The agent can `grep` this file to locate any function instantly
            # without opening individual source files.
            - name: Generate symbol index
              shell: pwsh
              run: |
                  $index = [System.Collections.Generic.List[string]]::new()
                  $index.Add('# TU-ACME symbol index — generated by copilot-setup-steps')
                  $index.Add('# Format: <kind> <name> <file>:<line>')
                  $index.Add('')

                  Get-ChildItem -Path ./src -Recurse -Filter '*.ps1' | Sort-Object FullName | ForEach-Object {
                      $relPath = $_.FullName.Replace($PWD.Path + '\', '').Replace('\', '/')
                      $lineNum = 0
                      foreach ($line in (Get-Content $_.FullName)) {
                          $lineNum++
                          # function definitions
                          if ($line -match '^\s*function\s+([\w-]+)') {
                              $index.Add("function $($Matches[1]) ${relPath}:${lineNum}")
                          }
                          # param() blocks that declare a named parameter
                          if ($line -match '^\s*\[.*\]\s*\$(\w+)\s*[,=)]') {
                              $index.Add("param    `$$($Matches[1]) ${relPath}:${lineNum}")
                          }
                      }
                  }

                  $index | Set-Content -Path ./.github/symbol-index.txt -Encoding UTF8
                  Write-Host "Symbol index written: $($index.Count) entries."
                  Get-Content ./.github/symbol-index.txt | Select-Object -First 30 | Write-Host
