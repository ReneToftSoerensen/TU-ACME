name: TU-ACME Test Suite

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite - ${{ matrix.test-type }}
    runs-on: windows-latest

    strategy:
      matrix:
        test-type: [Unit, Integration, Scripts]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PowerShell Module Cache
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\Documents\PowerShell\Modules\Pester
            C:\Users\runneradmin\Documents\PowerShell\Modules\Posh-ACME
          key: ps-modules-${{ runner.os }}-${{ hashFiles('**/psd1') }}
          restore-keys: |
            ps-modules-${{ runner.os }}-

      - name: Display Windows PowerShell Version
        shell: powershell
        run: $PSVersionTable.PSVersion | Out-String

      - name: Install Dependencies
        shell: powershell
        run: |
          Install-Module -Name Posh-ACME -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Create TestResults Directory
        shell: powershell
        run: New-Item -ItemType Directory -Path TestResults -Force | Out-Null

      - name: Run ${{ matrix.test-type }} Tests
        shell: powershell
        run: |
          $cfg = & ".\tests\pester.config.ps1"
          switch ("${{ matrix.test-type }}") {
            "Unit" {
              $cfg.Filter.Tag = @('Unit')
              $cfg.Filter.ExcludeTag = @('LiveExternal', 'Integration')
            }
            "Integration" {
              $cfg.Filter.Tag = @('Integration')
              $cfg.Filter.ExcludeTag = @('LiveExternal')
            }
            "Scripts" {
              $cfg.Filter.Tag = @('Scripts')
              $cfg.Filter.ExcludeTag = @('LiveExternal')
            }
          }
          $cfg.Run.PassThru = $true
          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-type }}
          path: TestResults/

      - name: Publish Coverage (Unit only)
        if: always() && matrix.test-type == 'Unit'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage.xml
