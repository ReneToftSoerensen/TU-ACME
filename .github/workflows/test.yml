name: TU-ACME Test Suite

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit + Integration Tests (Windows PS 5.1)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Windows PowerShell 5.1
        shell: powershell
        run: $PSVersionTable.PSVersion | Out-String

      - name: Install Posh-ACME (runtime prerequisite for mocking)
        shell: powershell
        run: |
          Install-Module -Name Posh-ACME -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Install Pester 5.x
        shell: powershell
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Create TestResults directory
        shell: powershell
        run: New-Item -ItemType Directory -Path TestResults -Force | Out-Null

      - name: Run Unit Tests
        shell: powershell
        run: |
          $cfg = & ".\tests\pester.config.ps1"
          $cfg.Filter.Tag = @('Unit')
          $cfg.Filter.ExcludeTag = @('LiveExternal', 'Integration')
          $cfg.Run.PassThru = $true
          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Run Integration Tests
        shell: powershell
        run: |
          $cfg = & ".\tests\pester.config.ps1"
          $cfg.Filter.Tag = @('Integration')
          $cfg.Filter.ExcludeTag = @('LiveExternal')
          $cfg.Run.PassThru = $true
          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      - name: Publish Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage.xml

  script-tests:
    name: Standalone Script Tests
    runs-on: windows-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 5.x
        shell: powershell
        run: Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Install Posh-ACME
        shell: powershell
        run: Install-Module -Name Posh-ACME -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Create TestResults directory
        shell: powershell
        run: New-Item -ItemType Directory -Path TestResults -Force | Out-Null

      - name: Run Script Tests
        shell: powershell
        run: |
          $cfg = & ".\tests\pester.config.ps1"
          $cfg.Filter.Tag = @('Scripts')
          $cfg.Filter.ExcludeTag = @('LiveExternal')
          $cfg.Run.PassThru = $true
          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) { exit 1 }
