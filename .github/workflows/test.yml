name: test

on:
  push:
  pull_request:

jobs:
  pester:
    name: Pester (${{ matrix.os }}, ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        run: |
          # Retry with backoff: PowerShell Gallery intermittently returns 504s,
          # and a failed dependency install must not be reported as a test failure.
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
                Install-PSResource -Name Pester -Version '[5.5.0,)' -TrustRepository -Scope CurrentUser
              }
              else {
                if ($PSVersionTable.PSEdition -eq 'Desktop') {
                  $null = Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
                }
                if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                  Register-PSRepository -Default
                }
                Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
                Install-Module -Name Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
              }
              Write-Host ('Pester installed on attempt {0}.' -f $attempt)
              break
            }
            catch {
              Write-Host ('Pester install attempt {0} of {1} failed: {2}' -f $attempt, $maxAttempts, $_.Exception.Message)
              if ($attempt -eq $maxAttempts) { throw }
              Start-Sleep -Seconds ([math]::Pow(2, $attempt) * 5)
            }
          }

      - name: Run unit tests
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $configuration = & ./tests/pester.config.ps1
          $configuration.Run.Exit = $true
          Invoke-Pester -Configuration $configuration

      - name: Run script tests
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests/Scripts'
          $configuration.Filter.Tag = @('Scripts')
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.Run.Exit = $true
          Invoke-Pester -Configuration $configuration
