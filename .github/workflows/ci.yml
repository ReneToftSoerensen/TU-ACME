name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, NewTestTui]

permissions:
  contents: read

jobs:
  build:
    name: Analyze and test (Windows)
    runs-on: windows-latest

    env:
      # Native Pebble release to download for the full-scale issuance test.
      PEBBLE_VERSION: v2.10.1
      # The integration suites (Pester 'Integration' tag and the tui-test
      # integration spec) self-enable when these are set.
      TUACME_ACME_DIRECTORY: https://localhost:14000/dir
      TUACME_CHALLTESTSRV: http://localhost:8055
      POSHACME_PLUGINS: ${{ github.workspace }}/tests/Integration/plugins
      # The TUI full-integration spec drives the wizard to issue a real cert; it
      # needs an IIS site whose HTTP binding carries this host header so the
      # WACS-style picker has a host to select.
      TUACME_TUI_INTEGRATION: '1'
      TUACME_TUI_HOST: tui.acme.test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Install-Module -Name Posh-ACME -MinimumVersion 4.0 -Force -Scope CurrentUser
          Install-Module -Name IISAdministration -Force -Scope CurrentUser

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install IIS and a host-header HTTP endpoint
        shell: pwsh
        run: |
          # IIS provides the Microsoft.Web.Administration types the module's IIS
          # helpers use, and a site whose HTTP binding carries a host header for
          # the WACS-style picker. The binding is on port 8080 so it never
          # competes with Pebble or the loopback ACME traffic.
          Install-WindowsFeature -Name Web-Server, Web-Mgmt-Console | Out-Null
          Import-Module IISAdministration
          $root = Join-Path $env:SystemDrive 'inetpub\tuiacme'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $existing = Get-IISSite -Name 'tuiacme' -ErrorAction SilentlyContinue
          if (-not $existing) {
              New-IISSite -Name 'tuiacme' -PhysicalPath $root `
                  -BindingInformation "*:8080:$env:TUACME_TUI_HOST" -Protocol http
          }
          Get-IISSite | Format-Table -AutoSize | Out-String | Write-Host

      - name: Install tui-test dependencies
        shell: pwsh
        working-directory: tests/Tui
        run: npm ci

      - name: Import module
        shell: pwsh
        run: Import-Module ./src/TU-ACME.psd1 -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
              $results | Format-Table -AutoSize | Out-String | Write-Host
              throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
          Write-Host 'PSScriptAnalyzer clean.'

      - name: Download Pebble and challtestsrv (native Windows binaries)
        shell: pwsh
        run: |
          $base = "https://github.com/letsencrypt/pebble/releases/download/$env:PEBBLE_VERSION"
          Invoke-WebRequest "$base/pebble-windows-amd64.zip" -OutFile pebble.zip
          Invoke-WebRequest "$base/pebble-challtestsrv-windows-amd64.zip" -OutFile challtestsrv.zip
          Expand-Archive -Path pebble.zip -DestinationPath pebble -Force
          Expand-Archive -Path challtestsrv.zip -DestinationPath challtestsrv -Force

      - name: Generate Pebble TLS certificate and runtime config
        shell: pwsh
        run: |
          $tlsRoot = Join-Path $PWD 'pebble-tls'
          New-Item -ItemType Directory -Path $tlsRoot -Force | Out-Null

          $key = [System.Security.Cryptography.RSA]::Create(2048)
          $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
            'CN=localhost',
            $key,
            [System.Security.Cryptography.HashAlgorithmName]::SHA256,
            [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
          )
          $sanBuilder = [System.Security.Cryptography.X509Certificates.SubjectAlternativeNameBuilder]::new()
          $sanBuilder.AddDnsName('localhost')
          $sanBuilder.AddIpAddress([System.Net.IPAddress]::Loopback)
          $request.CertificateExtensions.Add($sanBuilder.Build())
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($false, $false, 0, $false)
          )
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature -bor
              [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::KeyEncipherment,
              $false
            )
          )
          $ekuOids = [System.Security.Cryptography.OidCollection]::new()
          $ekuOids.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.1', 'Server Authentication')) | Out-Null
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($ekuOids, $false)
          )

          $cert = $request.CreateSelfSigned(
            [System.DateTimeOffset]::UtcNow.AddDays(-1),
            [System.DateTimeOffset]::UtcNow.AddDays(7)
          )

          $certPath = Join-Path $tlsRoot 'pebble-cert.pem'
          $keyPath = Join-Path $tlsRoot 'pebble-key.pem'
          Set-Content -Path $certPath -Value $cert.ExportCertificatePem() -NoNewline
          Set-Content -Path $keyPath -Value $key.ExportPkcs8PrivateKeyPem() -NoNewline

          $configPath = Join-Path $PWD 'tests/Integration/pebble-config.json'
          $config = Get-Content -Path $configPath -Raw | ConvertFrom-Json
          $config.pebble | Add-Member -NotePropertyName certificate -NotePropertyValue $certPath
          $config.pebble | Add-Member -NotePropertyName privateKey -NotePropertyValue $keyPath
          $runtimeConfigPath = Join-Path $PWD 'pebble-config.runtime.json'
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path $runtimeConfigPath -Encoding UTF8

      - name: Start Pebble and challtestsrv
        shell: pwsh
        run: |
          $cts = Join-Path $PWD 'challtestsrv/pebble-challtestsrv-windows-amd64/windows/amd64/pebble-challtestsrv.exe'
          $pebble = Join-Path $PWD 'pebble/pebble-windows-amd64/windows/amd64/pebble.exe'
          $config = Join-Path $PWD 'pebble-config.runtime.json'

          # pebble-challtestsrv answers DNS-01 lookups and exposes a management API
          # the ChallTestSrv test plugin uses to publish/clear TXT records. The
          # HTTP/HTTPS/TLS-ALPN challenge servers are disabled (empty addresses).
          # A single command-line string is passed verbatim, so the empty "" tokens
          # reach challtestsrv as genuine empty arguments that disable those servers.
          Start-Process -FilePath $cts `
            -ArgumentList '-management :8055 -dnsserver :8053 -http01 "" -https01 "" -tlsalpn01 "" -doh ""' `
            -RedirectStandardOutput challtestsrv.out.log -RedirectStandardError challtestsrv.err.log

          # Pebble is the official test ACME CA; point it at challtestsrv for DNS.
          # PEBBLE_VA_NOSLEEP removes the randomized validation delay so the test
          # finishes quickly. The runtime config injects a short-lived self-signed
          # certificate because the Windows Pebble binary now requires explicit TLS
          # certificate and key paths.
          $env:PEBBLE_VA_NOSLEEP = '1'
          Start-Process -FilePath $pebble `
            -ArgumentList "-config `"$config`" -dnsserver 127.0.0.1:8053" `
            -RedirectStandardOutput pebble.out.log -RedirectStandardError pebble.err.log

      - name: Wait for the ACME directory
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 30; $i++) {
              try {
                  Invoke-WebRequest -Uri $env:TUACME_ACME_DIRECTORY -SkipCertificateCheck -UseBasicParsing | Out-Null
                  Write-Host 'ACME directory is up.'
                  exit 0
              } catch {
                  Write-Host "Attempt $($i + 1)/30 failed: $($_.Exception.Message)"
                  Start-Sleep -Seconds 2
              }
          }
          Write-Error 'Pebble did not become ready in time.'
          if (Test-Path pebble.err.log) { Get-Content pebble.err.log | Write-Host }
          exit 1

      - name: Run Pester (unit and integration)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Run tui-test (interactive UI + full integration)
        shell: pwsh
        working-directory: tests/Tui
        run: npx @microsoft/tui-test

      - name: Upload tui-test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tui-traces
          path: tests/Tui/tui-traces
          if-no-files-found: ignore

      - name: Test server logs on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($log in 'pebble.out.log', 'pebble.err.log', 'challtestsrv.out.log', 'challtestsrv.err.log') {
              if (Test-Path $log) {
                  Write-Host "::group::$log"
                  Get-Content $log | Write-Host
                  Write-Host '::endgroup::'
              }
          }
